apiVersion: apps/v1
kind: Deployment
metadata:
  name: lampa-sync
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lampa-sync
  template:
    metadata:
      labels:
        app: lampa-sync
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      containers:
        - name: sync
          image: ghcr.io/mvinkarklins/lampa-sync:3.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 60
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lampa-sync-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lampa-sync-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lampa-sync
  namespace: media
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.25
  externalTrafficPolicy: Local
  selector:
    app: lampa-sync
  ports:
    - name: http
      port: 80
      targetPort: 8080
