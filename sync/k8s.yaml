apiVersion: apps/v1
kind: Deployment
metadata:
  name: lampa-sync
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lampa-sync
  template:
    metadata:
      labels:
        app: lampa-sync
    spec:
      # data was a hostPath pinned to server3 (moved there from the NAS on 2026-10-09); now a
      # Longhorn PVC instead, so it's replicated and not tied to one node's local disk.
      # nodeSelector stays for this PR so the migrate-data initContainer can reach the real
      # hostPath data on server3 one more time; drop it in a follow-up PR once the PVC is verified
      # good (same two-step pattern used for the NFS->Longhorn moves in home-media).
      nodeSelector:
        kubernetes.io/hostname: server3
      containers:
        - name: sync
          image: ghcr.io/mvinkarklins/lampa-sync:3.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 60
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
      initContainers:
        - name: migrate-data
          image: busybox:1.36
          command: ['sh', '-c', 'if [ ! -f /data/.migrated ]; then cp -a /data-src/. /data/ && touch /data/.migrated; fi']
          volumeMounts:
            - name: data-src
              mountPath: /data-src
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: data-src
          hostPath:
            path: /var/snap/microk8s/common/default-storage/lampa-sync
            type: DirectoryOrCreate
        - name: data
          persistentVolumeClaim:
            claimName: lampa-sync-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lampa-sync-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lampa-sync
  namespace: media
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.25
  externalTrafficPolicy: Local
  selector:
    app: lampa-sync
  ports:
    - name: http
      port: 80
      targetPort: 8080
