name: tag release

# Everything else (purge jsDelivr, build/publish the sync image, pin its version in
# sync/k8s.yaml) already runs off the tag push (see release.yml and check.yml). This just
# creates and pushes that tag, so a release can be cut from GitHub's UI instead of a local
# checkout with push access — release.sh still works too, this is an alternative, not a
# replacement.
#
# Pushing with the default GITHUB_TOKEN does not fire the push event other workflows listen
# for (GitHub's own loop prevention), so release.yml/check.yml would never see the tag. A
# personal access token doesn't have that restriction, so this pushes with one instead:
# add a fine-grained PAT (this repo, Contents: Read and write) as the repository secret
# RELEASE_PAT (Settings > Secrets and variables > Actions).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.1.0 (without the v)'
        required: true

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check RELEASE_PAT is set
        run: |
          if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
            echo "::error::Add a fine-grained PAT (Contents: Read and write on this repo) as the RELEASE_PAT secret first — a tag pushed with the default token would not trigger release.yml/check.yml." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "expected X.Y.Z, got '${{ inputs.version }}'" >&2; exit 1; }

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
